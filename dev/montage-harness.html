<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>MontagePlayer 开发预览</title>
    <link rel="icon" href="/icons/icon-192.png" />
    <style>
      /*
        和产品页同一个底色（index.html 的 --bg-grad）：
        MontagePlayer 默认 tone="site" 是透明的，底色由宿主页面决定，
        这里把同样的渐变铺上，预览时看到的就和真实页面一致。
      */
      html,
      body {
        margin: 0;
        height: 100%;
      }
      html {
        background: #f7e2e2;
        background-image: linear-gradient(
          165deg,
          #f9ecd7 0%,
          #f7e2e2 42%,
          #f2dbe4 70%,
          #eccfda 100%
        );
      }
      body {
        background: transparent;
      }
      #app {
        height: 100%;
      }
      .harness-btn {
        position: fixed;
        left: 6px;
        top: 6px;
        z-index: 9999;
        font-size: 11px;
        padding: 4px 6px;
        opacity: 0.35;
      }
    </style>
  </head>
  <body>
    <!--
      MontagePlayer 的独立开发/验收页（只在 vite dev 下可用，不会进构建产物）：
        npm run dev:montage
        → http://localhost:5174/dev/montage-harness.html
      参数：?slot=1500&fade=600（停留时长 / 交叉淡化时长，调快便于调试）
    -->
    <div id="app"></div>
    <script type="module" src="/dev/montage-harness.js"></script>
  </body>
</html>
