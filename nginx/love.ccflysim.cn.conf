# ============================================================================
#  love.ccflysim.cn —— 我们的恋爱回忆录
#  纯静态 SPA（Vite 构建产物），不需要 Node/Python 常驻进程
#  ---------------------------------------------------------------------------
#  部署位置：
#    /etc/nginx/sites-available/love.ccflysim.cn   ← 本文件
#    ln -s /etc/nginx/sites-available/love.ccflysim.cn /etc/nginx/sites-enabled/
#    /var/www/love.ccflysim.cn/                    ← dist 内容（index.html + assets/）
#
#  和主站（ccflysim.cn，端口 3015）完全独立：
#    主站是 server_name ccflysim.cn + 反代，本文件是 server_name love.ccflysim.cn
#    彼此不干扰，nginx 按 Host 头路由。
#
#  适配：服务器是 Ubuntu + nginx 1.18.0（不支持 `http2 on;` 这种 ≥1.25 的新语法），
#        所以 HTTP/2 必须写成 `listen 443 ssl http2;` 的旧写法。
#
#  首次部署顺序（重要，顺序反了 nginx -t 会因为证书不存在而失败）：
#    1) 上传 dist → /var/www/love.ccflysim.cn/
#    2) 先用 love.ccflysim.cn.http-first.conf（只有 80 端口）跑起来
#    3) certbot certonly --webroot -w /var/www/love.ccflysim.cn -d love.ccflysim.cn
#    4) 再换成本文件（含 443），nginx -t && systemctl reload nginx
# ============================================================================

# ---------------------------------------------------------------- 80 → 443
server {
    listen 80;
    listen [::]:80;
    server_name love.ccflysim.cn;

    # 给 Let's Encrypt 的 HTTP-01 验证留一条路（必须放在 redirect 之前）
    location /.well-known/acme-challenge/ {
        root /var/www/love.ccflysim.cn;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------- 443 主配置
server {
    # nginx 1.18：HTTP/2 只能挂在 listen 上，没有 `http2 on;` 指令
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name love.ccflysim.cn;

    # ---- TLS ----
    ssl_certificate     /etc/letsencrypt/live/love.ccflysim.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/love.ccflysim.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # 注意：这里刻意不开 ssl_stapling（OCSP 装订）——
    # 它需要在 http{} 里配 resolver，否则 nginx 直接报 no resolver defined 起不来；
    # 本项目是纯静态小站，省掉这层没有实际收益。

    # ---- 站点根目录 ----
    root  /var/www/love.ccflysim.cn;
    index index.html;

    # 只记录错误和真实请求，静态资源访问不刷日志
    access_log /var/log/nginx/love.ccflysim.cn.access.log;
    error_log  /var/log/nginx/love.ccflysim.cn.error.log warn;

    # ---- 压缩（首屏 JS/CSS 只有几十 KB，开了更省流量）----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;

    # ---- 安全响应头 ----
    # 注意：CSP 里必须有 data:（照片是 Canvas 压缩后的 Base64 dataURL）
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    # HSTS：确认全站 HTTPS 稳定后可以打开（建议先注释，跑一周再加）
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ========================================================================
    #  核心：SPA 防 404
    #  Vue Router 用的是 history 模式（其实本项目只有一个页面，但这条规则
    #  能保证 / 之外的任何路径、以及手滑刷新的任何 URL 都回到 index.html，
    #  而不是 nginx 的 404 页面）
    # ========================================================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 带内容哈希的构建产物：一年强缓存，永不过期 ----
    # Vite 产出的文件名形如 index-Ck3f9a2d.js，内容变了文件名就变了，
    # 所以可以放心 immutable；这样回访时连一个请求都不用再验证
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ---- index.html 绝不缓存 ----
    # 否则新版本部署后，微信里打开的旧页面会一直引用已删除的旧 JS，
    # 表现为白屏 / 点击无反应（这个坑非常常见）
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
        # 这一处要重复安全头：add_header 在 location 里一旦出现就不再继承上层
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ---- favicon 走内联，没有真实文件也无所谓，别让它 404 刷日志 ----
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }

    # 本项目没有上传接口，把体积上限压到很小（防被当成图床上传点）
    client_max_body_size 64k;
}
