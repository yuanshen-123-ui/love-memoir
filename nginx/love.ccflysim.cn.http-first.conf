# ============================================================================
#  love.ccflysim.cn —— 首次部署用的「仅 HTTP」临时配置
#  ---------------------------------------------------------------------------
#  用途：服务器上还没有 love.ccflysim.cn 的证书时，先用这份把站点跑起来，
#        Let's Encrypt 需要能通过 80 端口访问 /.well-known/acme-challenge/。
#
#  用法：
#    cp love.ccflysim.cn.http-first.conf /etc/nginx/sites-available/love.ccflysim.cn
#    ln -sf /etc/nginx/sites-available/love.ccflysim.cn /etc/nginx/sites-enabled/
#    nginx -t && systemctl reload nginx
#    certbot certonly --webroot -w /var/www/love.ccflysim.cn -d love.ccflysim.cn
#
#  拿到证书后，用 love.ccflysim.cn.conf 覆盖同名文件，再 nginx -t && reload。
# ============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name love.ccflysim.cn;

    root  /var/www/love.ccflysim.cn;
    index index.html;

    access_log /var/log/nginx/love.ccflysim.cn.access.log;
    error_log  /var/log/nginx/love.ccflysim.cn.error.log warn;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # SPA 防 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }
}
