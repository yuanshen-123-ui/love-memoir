<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />

    <!--
      移动端视口三件套，缺一不可：
      1. viewport-fit=cover —— 没有它 env(safe-area-inset-*) 永远是 0，iPhone 小黑条会盖住底部按钮
      2. maximum-scale / user-scalable=no —— 防止微信里双指缩放把排版放大错位
      3. initial-scale=1 —— 基准缩放
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />

    <!-- iOS 状态栏与浏览器 UI 的配色（安卓微信/Chrome 也读这个）。
         必须和 index.html 里 --bg-fill / manifest.theme_color 一致，否则状态栏会有一条「另一种颜色」 -->
    <meta name="theme-color" content="#f7e2e2" />

    <!-- 别把日期/电话识别成可点链接（微信里点了会跳走，很破坏体验） -->
    <meta name="format-detection" content="telephone=no, email=no, address=no" />

    <!-- 添加到主屏时用全屏 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="恋爱回忆录" />

    <!-- 把链接发到微信/QQ 时的那张卡片（微信不读 JSSDK 时用的是标题 + 首图） -->
    <meta name="description" content="放进我们的第一张照片，点亮星星，刮开回忆，然后贴贴。" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="我们的恋爱回忆录" />
    <meta property="og:description" content="放进我们的第一张照片，点亮星星，刮开回忆，然后贴贴。" />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og.png" />

    <!-- 图标：Apple 主屏 + PWA（由 scripts/gen-icons.mjs 用纯数学画出来的） -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <title>我们的恋爱回忆录</title>

    <style>
      /*
        ★ 全站底色在这里定义 —— 这是唯一来源，src/style.css 不再重复定义。

        为什么必须放在 <head> 内联：
          Vite 会把 style.css 打包成 <link> 插到 head 末尾，
          在它加载完成之前页面没有任何底色（白闪）。所以底色要在最前面就画上。

        以前这里写的是另一个渐变、而 style.css 里 body 又写了个纯色 #f6e3dc，
        结果 <link> 覆盖了内联渐变 → 首屏是纯色、挂载后是渐变，一眼就能看出「底色变了」。
        现在三处统一成同一个 --bg-grad / --bg-fill：
          · html 画渐变（body 与 #app 全部透明，谁都不盖它）
          · style.css 的 .bg-base 用 var(--bg-grad) 再铺一层（它也是透明的，只为叠光球）
      */
      :root {
        --bg-grad: linear-gradient(165deg, #f9ecd7 0%, #f7e2e2 42%, #f2dbe4 70%, #eccfda 100%);
        --bg-fill: #f7e2e2; /* 渐变取不到时的兜底纯色，也是浏览器 UI / manifest 的主题色 */
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      html {
        background: var(--bg-fill);
        background-image: var(--bg-grad);
      }
      body {
        /* 透明！否则 body 自身的底色会盖住 html 上那层渐变 */
        background: transparent;
        overflow: hidden;
        overscroll-behavior-y: none;
        -webkit-tap-highlight-color: transparent;
      }
      #app {
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
