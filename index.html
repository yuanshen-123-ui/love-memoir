<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />

    <!--
      移动端视口三件套，缺一不可：
      1. viewport-fit=cover —— 没有它 env(safe-area-inset-*) 永远是 0，iPhone 小黑条会盖住底部按钮
      2. maximum-scale / user-scalable=no —— 防止微信里双指缩放把排版放大错位
      3. initial-scale=1 —— 基准缩放
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />

    <!-- iOS 状态栏与浏览器 UI 的配色（安卓微信/Chrome 也读这个） -->
    <meta name="theme-color" content="#f4e2da" />

    <!-- 别把日期/电话识别成可点链接（微信里点了会跳走，很破坏体验） -->
    <meta name="format-detection" content="telephone=no, email=no, address=no" />

    <!-- 添加到主屏时用全屏 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="恋爱回忆录" />

    <!-- 把链接发到微信/QQ 时的那张卡片（微信不读 JSSDK 时用的是标题 + 首图） -->
    <meta name="description" content="放进我们的第一张照片，点亮星星，刮开回忆，然后贴贴。" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="我们的恋爱回忆录" />
    <meta property="og:description" content="放进我们的第一张照片，点亮星星，刮开回忆，然后贴贴。" />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og.png" />

    <!-- 图标：Apple 主屏 + PWA（由 scripts/gen-icons.mjs 用纯数学画出来的） -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <title>我们的恋爱回忆录</title>

    <style>
      /*
        首屏兜底样式（内联，先于 JS 生效）：
        避免 Vue 挂载前出现白屏 flash，也避免这一瞬间出现原生滚动条。
        真正的设计系统在 src/style.css 里。
      */
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: linear-gradient(160deg, #f7e6cf 0%, #f6dfe3 48%, #f0d6df 100%);
        overflow: hidden;
        overscroll-behavior-y: none;
        -webkit-tap-highlight-color: transparent;
      }
      #app {
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
