name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: 构建校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: Lint（ESLint 9 flat config）
        run: npm run lint

      - name: 单元测试（Vitest）
        run: npm test

      - name: 构建
        run: npm run build

      - name: 产物体积
        run: |
          echo '--- dist ---'
          du -sh dist
          echo '--- gzip 后 ---'
          for f in dist/assets/*.js dist/assets/*.css; do
            echo "$f  $(gzip -c "$f" | wc -c) bytes (gzip)"
          done

      # 这几条是为了守住「移动端体验」不被后续改动破坏的硬约束。
      # 说明：只扫代码行，注释里提到 alert()/hover 不算（否则注释本身会误报）。
      - name: 静态检查（禁止原生弹窗 / 禁止 :hover / 禁止写死 100vh 全屏）
        run: |
          fail=0

          echo '--- 原生 alert / confirm / prompt ---'
          hits=$(grep -rnE --include=*.vue --include=*.js \
                   'alert\(|confirm\(|prompt\(' src \
                 | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(\*|//|/\*)' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo '::error::发现原生 alert/confirm/prompt 调用（本项目要求用自绘 toast）'
            fail=1
          else
            echo 'OK'
          fi

          echo '--- :hover 规则 ---'
          hov=$(grep -rn --include=*.vue --include=*.css ':hover' src || true)
          if [ -n "$hov" ]; then
            echo "$hov"
            echo '::error::发现 :hover 规则（触屏上会粘连成 bug，请改用 :active）'
            fail=1
          else
            echo 'OK'
          fi

          echo '--- 全屏高度是否只走 100dvh / --app-h ---'
          # 允许 100vh 作为最外层兜底（见 style.css 的三级兜底注释），
          # 但除 .stage 之外不允许再出现 height: 100vh
          bad=$(grep -rn --include=*.vue --include=*.css 'height:[[:space:]]*100vh' src \
                | grep -v 'style.css' || true)
          if [ -n "$bad" ]; then
            echo "$bad"
            echo '::error::100vh 只能在 style.css 的 .stage 三级兜底里出现'
            fail=1
          else
            echo 'OK'
          fi

          [ "$fail" -eq 0 ] && echo '静态检查全部通过'
          exit "$fail"
